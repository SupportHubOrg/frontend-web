apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  labels:
    app: frontend-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
    spec:
      containers:
      - name: frontend-web
        #Replace with actual container registry URL
        image: your-registry.com/issueresolutionorg/frontend-web:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: frontend-web-config
